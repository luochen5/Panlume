# C4 独立本地复盘演示：复用第三阶段模拟证据，写入新的嵌目录数据库。
# 不复用主库、既有 analysis-test.db、真实行情库或真实持仓。
monitor:
  interval_seconds: 300
  fetch_timeout_seconds: 20
  close_timeout_seconds: 45

rules:
  rapid_move_pct: 1.0
  volume_ratio_threshold: 1.5
  breakout_lookback_minutes: 20
  normal_cooldown_seconds: 1800
  high_priority_repeat_seconds: 900

summary:
  queue_capacity: 8
  shutdown_timeout_seconds: 10
  max_chars: 400

storage:
  # analysis-demo 会检查文件名；嵌目录保证它与既有第三阶段演示库分开。
  database: runtime/review-fixture/analysis-test.db

models:
  ollama:
    enabled: false
    base_url: http://127.0.0.1:11434
    model: deepseek-r1:14b
    timeout_seconds: 60
  cloud:
    enabled: false
    base_url: ""
    model: ""
    event_whitelist: []

watchlist:
  - code: "600000"
    name: "本地复盘止损演示对象"
  - code: "000001"
    name: "本地复盘普通事件演示对象"
