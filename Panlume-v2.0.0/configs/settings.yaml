# 所有相对路径以启动命令所在的项目根目录为基准。
monitor:
  # 推荐档位：60=1 分钟，300=5 分钟（默认），600=10 分钟。
  # 也支持其他 60～3600 秒的自定义值；每轮都会增量补齐中间的一分钟数据。
  interval_seconds: 300
  # 单次只读数据请求和整个收盘收尾的等待上限。
  fetch_timeout_seconds: 20
  close_timeout_seconds: 45

# 盘中规则阈值。止损价不在这里，而在每个人工确认的持仓批次中。
rules:
  rapid_move_pct: 1.0
  volume_ratio_threshold: 1.5
  breakout_lookback_minutes: 20
  normal_cooldown_seconds: 1800
  high_priority_repeat_seconds: 900

# 确定性动量指标。分钟使用 adjustment=none，日线使用 adjustment=qfq。
indicators:
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  rsi_period: 14

# 本地异步摘要。只限制最终摘要上限，不要求凑足最低字数。
summary:
  queue_capacity: 8
  shutdown_timeout_seconds: 10
  max_chars: 400

storage:
  database: runtime/pandeng.db

models:
  ollama:
    enabled: true
    base_url: http://127.0.0.1:11434
    model: deepseek-r1:14b
    timeout_seconds: 60

  cloud:
    # 当前版本不会调用云端。后续阶段仍默认关闭。
    enabled: false
    base_url: ""
    model: ""
    event_whitelist: []

# 以下代码仅用于演示配置格式，不代表任何投资推荐。
watchlist:
  - code: "600000"
    name: "示例对象1"
  - code: "000001"
    name: "示例对象2"
  - code: "601318"
    name: "示例对象3"
  - code: "000858"
    name: "示例对象4"
  - code: "300750"
    name: "示例对象5"
