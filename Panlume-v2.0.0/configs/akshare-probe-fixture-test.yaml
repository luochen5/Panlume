# C3 离线双探针：读取已保存样本，不联网、不导入 AKShare、不实际等待。
# 使用独立嵌目录新库，避免接触已有 akshare-live-test.db 和主库。
monitor:
  interval_seconds: 300
  fetch_timeout_seconds: 20
  close_timeout_seconds: 45

rules:
  rapid_move_pct: 1.0
  volume_ratio_threshold: 1.5
  breakout_lookback_minutes: 20
  normal_cooldown_seconds: 1800
  high_priority_repeat_seconds: 900

summary:
  queue_capacity: 8
  shutdown_timeout_seconds: 10
  max_chars: 400

storage:
  database: runtime/akshare-probe-fixture/akshare-live-test.db

models:
  ollama:
    enabled: false
    base_url: http://127.0.0.1:11434
    model: deepseek-r1:14b
    timeout_seconds: 60
  cloud:
    enabled: false
    base_url: ""
    model: ""
    event_whitelist: []

watchlist:
  - code: "000001"
    name: "C3 离线双探针样本"
