# 真实行情适配器 B 离线验收专用配置。相对路径以项目根目录为基准。
monitor:
  # 60 秒=1 分钟档，仅用于手动时钟离线演示；正式默认仍为 300 秒。
  interval_seconds: 60
  fetch_timeout_seconds: 20
  close_timeout_seconds: 45

rules:
  rapid_move_pct: 1.0
  volume_ratio_threshold: 1.5
  breakout_lookback_minutes: 20
  normal_cooldown_seconds: 1800
  high_priority_repeat_seconds: 900

summary:
  queue_capacity: 8
  shutdown_timeout_seconds: 10
  max_chars: 400

storage:
  # adapter-demo 会强制核对文件名，并拒绝已有业务数据的测试库。
  database: runtime/adapter-test.db

models:
  ollama:
    enabled: false
    base_url: http://127.0.0.1:11434
    model: deepseek-r1:14b
    timeout_seconds: 60
  cloud:
    enabled: false
    base_url: ""
    model: ""
    event_whitelist: []

watchlist:
  - code: "600000"
    name: "离线样例一"
  - code: "000001"
    name: "离线样例二"
