# 真实行情接入 C1：只读离线 Tushare 虚拟响应，独立数据库，禁止模型与云端。
# 所有相对路径以项目根目录为基准。
monitor:
  interval_seconds: 300
  fetch_timeout_seconds: 20
  close_timeout_seconds: 45

rules:
  rapid_move_pct: 1.0
  volume_ratio_threshold: 1.5
  breakout_lookback_minutes: 20
  normal_cooldown_seconds: 1800
  high_priority_repeat_seconds: 900

summary:
  queue_capacity: 8
  shutdown_timeout_seconds: 10
  max_chars: 400

storage:
  # provider-fixture-demo 会强制核对这个文件名，并拒绝已有业务数据。
  database: runtime/real-data-test.db

models:
  ollama:
    enabled: false
    base_url: http://127.0.0.1:11434
    model: deepseek-r1:14b
    timeout_seconds: 60
  cloud:
    enabled: false
    base_url: ""
    model: ""
    event_whitelist: []

watchlist:
  - code: "600000"
    name: "虚拟样例对象甲"
  - code: "000001"
    name: "虚拟样例对象乙"
